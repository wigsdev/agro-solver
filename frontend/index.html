<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro-Solver v0.3</title>
    <!-- CSS y Fuentes -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Agro-Solver <span>🌾</span></h1>
            <p>Herramientas de Precisión</p>
        </header>

        <!-- Contenido Principal -->
        <main>
            <!-- Calculadora Card -->
            <section class="card">
                <h3>Calculadora de Densidad 🌱</h3>

                <form id="density-form">
                    <div class="form-group">
                        <label for="system">Sistema de Siembra</label>
                        <select id="system">
                            <option value="square">Cuadro / Rectángulo</option>
                            <option value="triangular">Tresbolillo (Triangular)</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col">
                            <div class="form-group">
                                <label for="row_distance">Surcos (m)</label>
                                <input type="number" id="row_distance" step="0.01" min="0.1" placeholder="ej. 2.0"
                                    required>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-group">
                                <label for="plant_distance">Plantas (m)</label>
                                <input type="number" id="plant_distance" step="0.01" min="0.1" placeholder="ej. 2.5"
                                    required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="calc-btn" class="btn">Calcular Densidad</button>
                </form>

                <!-- Resultados -->
                <div id="result-display" class="hidden">
                    <div class="result-label">Población Estimada:</div>
                    <div id="density-value" class="result-value">-</div>
                    <div id="density-context" class="result-context">-</div>
                </div>
            </section>
        </main>

        <footer>
            Agro-Solver v0.3.0 &copy; 2026
        </footer>
    </div>

    <!-- Logic -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
