{% extends "base.html" %}

{% block title %}Conversor de Unidades - Agro-Tech{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 2rem;">
        <i class="fa-solid fa-right-left" style="font-size: 1.5rem; color: var(--primary-color);"></i>
        <h2 style="margin: 0;">Conversor de Unidades</h2>
    </div>

    <!-- Tabs -->
    <div style="display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color);">
        <button class="tab-btn active" data-category="area"
            style="padding: 10px 20px; background: none; border: none; font-weight: 600; color: var(--text-light); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s;">
            <i class="fa-solid fa-ruler-combined"></i> Superficie
        </button>
        <button class="tab-btn" data-category="weight"
            style="padding: 10px 20px; background: none; border: none; font-weight: 600; color: var(--text-light); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s;">
            <i class="fa-solid fa-weight-hanging"></i> Peso
        </button>
    </div>

    <!-- Converter Form -->
    <div class="row" style="align-items: center;">
        <!-- Input Side -->
        <div class="col">
            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" id="input-amount" value="1" min="0" step="any"
                    style="font-size: 1.25rem; font-weight: bold;">
            </div>
            <div class="form-group">
                <label>De:</label>
                <select id="select-from"></select>
            </div>
        </div>

        <!-- Arrow (Desktop only) -->
        <div style="text-align: center; color: var(--text-light);">
            <i class="fa-solid fa-arrow-right" style="font-size: 1.5rem;"></i>
        </div>

        <!-- Output Side -->
        <div class="col">
            <div class="form-group">
                <label>Resultado</label>
                <input type="number" id="output-amount" readonly
                    style="background-color: var(--bg-color); font-size: 1.25rem; font-weight: bold; color: var(--primary-color); cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>A:</label>
                <select id="select-to"></select>
            </div>
        </div>
    </div>

    <div
        style="margin-top: 2rem; padding: 1rem; background-color: #E3F2FD; border-radius: var(--radius-sm); font-size: 0.9rem; color: #0D47A1;">
        <i class="fa-solid fa-circle-info"></i> <strong>Nota:</strong> Factores aproximados. 1 Manzana = 7,000 m²
        (Estándar técnico).
    </div>
</div>

<style>
    /* Tab Active State Styles (Local) */
    .tab-btn.active {
        color: var(--primary-color) !important;
        border-bottom-color: var(--primary-color) !important;
    }

    .tab-btn:hover {
        color: var(--primary-dark) !important;
    }
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/converter.js') }}"></script>
{% endblock %}
