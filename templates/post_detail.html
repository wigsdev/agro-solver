{% extends "base.html" %}

{% block title %}{{ post.title }} - Agro-Tech Blog{% endblock %}

{% block content %}
<article style="max-width: 800px; margin: 0 auto; padding-bottom: 4rem;">
    <!-- Header -->
    <header style="text-align: center; margin-bottom: 2rem;">
        {% if post.image %}
        <img src="{{ post.image }}" alt="{{ post.title }}"
            style="width: 100%; height: 400px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 2rem; box-shadow: var(--shadow-md);">
        {% endif %}

        <div style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 0.5rem;">
            <i class="fa-regular fa-calendar"></i> {{ post.date }} | <i class="fa-solid fa-user-pen"></i> {{ post.author
            }}
        </div>

        <h1 style="font-size: 2.5rem; color: var(--primary-color); margin-bottom: 1rem;">{{ post.title }}</h1>
    </header>

    <!-- Content -->
    <div class="markdown-content" style="font-size: 1.125rem; line-height: 1.8; color: var(--text-color);">
        {{ post.content | safe }}
    </div>

    <!-- Footer -->
    <div style="margin-top: 4rem; text-align: center; padding-top: 2rem; border-top: 1px solid var(--border-color);">
        <a href="/blog" class="btn"
            style="background-color: transparent; border: 2px solid var(--primary-color); color: var(--primary-color);">
            <i class="fa-solid fa-arrow-left"></i> Volver al Blog
        </a>
    </div>
</article>

<style>
    /* Estilos para el contenido Markdown */
    .markdown-content h2 {
        color: var(--secondary-color);
        margin-top: 2rem;
    }

    .markdown-content h3 {
        color: var(--primary-light);
        margin-top: 1.5rem;
    }

    .markdown-content p {
        margin-bottom: 1rem;
    }

    .markdown-content ul,
    .markdown-content ol {
        margin-bottom: 1rem;
        padding-left: 2rem;
    }

    .markdown-content blockquote {
        border-left: 4px solid var(--accent-color);
        padding-left: 1rem;
        color: var(--text-light);
        font-style: italic;
        background: #f9f9f9;
        padding: 1rem;
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .markdown-content strong {
        color: var(--primary-dark);
    }
</style>
{% endblock %}
