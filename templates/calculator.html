{% extends "base.html" %}

{% block title %}Calculadora de Densidad - Agro-Tech{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div
        style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
        <i class="fa-solid fa-seedling" style="font-size: 1.5rem; color: var(--primary-color);"></i>
        <h2 style="margin: 0; font-size: 1.5rem;">Calculadora de Densidad</h2>
    </div>

    <form id="density-form">
        <div class="form-group">
            <label for="system"><i class="fa-solid fa-vector-square"></i> Sistema de Siembra</label>
            <select id="system">
                <option value="square">Cuadro / Rectángulo</option>
                <option value="triangular">Tresbolillo (Triangular)</option>
            </select>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="row_distance"><i class="fa-solid fa-arrows-left-right"></i> Surcos (m)</label>
                    <input type="number" id="row_distance" step="0.01" min="0.1" placeholder="ej. 2.0" required>
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label for="plant_distance"><i class="fa-solid fa-arrows-up-down"></i> Plantas (m)</label>
                    <input type="number" id="plant_distance" step="0.01" min="0.1" placeholder="ej. 2.5" required>
                </div>
            </div>
        </div>

        <button type="submit" id="calc-btn" class="btn btn-block">
            <i class="fa-solid fa-calculator"></i> Calcular Densidad
        </button>
    </form>

    <!-- Resultados -->
    <div id="result-display" class="hidden">
        <div class="result-label">Población Estimada:</div>
        <div id="density-value" class="result-value">-</div>
        <div id="density-context" class="result-context">-</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/config.js') }}"></script>
<script src="{{ url_for('static', path='/app.js') }}"></script>
{% endblock %}
